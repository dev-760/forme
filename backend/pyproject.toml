[project]
name = "wardrobe-ai-backend"
version = "1.3.0"
description = "Wardrobe AI - Backend API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "email-validator>=2.3.0",
    "PyJWT[crypto]>=2.15.1",
    "httpx>=0.28.1",
    "certifi>=2026.10.23",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "redis>=5.3.1,<6",
    "arq>=0.28.0",
    "aiosmtplib>=5.1.3",
    "tenacity>=9.2.1",
    "python-dateutil>=3.0.0",
    "imagehash>=4.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "aiosqlite>=0.22.1",
    "watchfiles>=1.3.0",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
